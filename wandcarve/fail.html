<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="fail.css" />
    <title>WandCarve — Off the path</title>
  </head>
  <body>
    <div id="app">
      <div class="phone">
        <div class="screen">
          <div class="center-screen">
            <!-- Status bar -->
            <div class="sbar" style="width: 100%">
              <span>9:41</span>
              <span>● ● ●</span>
            </div>

            <!-- Fail icon -->
            <div id="fail-icon">✕</div>

            <!-- Title -->
            <div id="fail-title">OFF THE PATH</div>

            <!-- Description -->
            <p id="fail-desc">
              The spell broke — the surprise stays locked. Give it another go!
            </p>

            <!-- Tip box -->
            <div id="fail-tip">
              <strong>Tip:</strong>
              Tap the green dot, then drag slowly along the violet line to each
              checkpoint.
            </div>

            <!-- Retry button -->
            <button class="main-btn" id="retry-btn">Try again</button>
          </div>
        </div>
      </div>
    </div>

    <script src="fail.js"></script>
  </body>
</html>
