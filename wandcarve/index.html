<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>WandCarve</title>
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
</head>
<body>
<script>
  // if there's a play hash, pass it on to intro.html
  // otherwise just send the person to the sender form
  const hash = location.hash;

  if (hash.startsWith('#play=')) {
    const encoded = hash.slice(6);
    location.replace('intro.html#data=' + encoded);
  } else {
    location.replace('sender.html');
  }
</script>
</body>
</html>
