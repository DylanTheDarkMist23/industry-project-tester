<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>WandCarve — Send a Spell</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
</head>
<body>

<div id="app">
  <div class="phone">
    <div class="screen">

      <div class="sbar"><span>9:41</span><span>● ● ●</span></div>

      <div class="wrap">

        <div>
          <div class="logo-title">WANDCARVE</div>
          <div class="logo-sub">Lock a surprise behind a spell</div>
        </div>

        <div>
          <div class="lbl">
            IMGBB API KEY &nbsp;
            <a href="https://api.imgbb.com" target="_blank"
               style="font-size:10px;color:#8A67CC;text-decoration:none;">
              Get free key ↗
            </a>
          </div>
          <div class="key-row">
            <input class="field" id="apiKey" type="password"
                   placeholder="Paste your API key here…" autocomplete="off" />
            <button class="key-test-btn" id="testBtn">Test</button>
          </div>
          <div class="key-status key-hint" id="keyStatus">
            Paste your key then tap Test to verify it works
          </div>
        </div>

        <div>
          <div class="lbl">YOUR NAME</div>
          <input class="field" id="senderName" type="text"
                 placeholder="Enter a name the receiver will know" maxlength="40" />
        </div>

        <div>
          <div class="lbl">
            BEGINNING MESSAGE
            <span style="opacity:.5;font-size:9px">(shown before the game)</span>
          </div>
          <textarea class="field" id="msgBefore" rows="2" maxlength="200"
                    placeholder="e.g. I have a little something for you…"></textarea>
        </div>

        <div>
          <div class="lbl">YOUR IMAGE</div>
          <div class="upload-zone" id="uploadZone">
            <div style="font-size:24px;color:#8A67CC;margin-bottom:5px">⬆</div>
            <div style="font-size:13px;color:rgba(255,255,255,.46)">Tap to choose a photo</div>
          </div>
          <img class="preview" id="imgPreview" alt="Your chosen photo" />
          <input type="file" id="fileInput" accept="image/*" />
        </div>

        <div>
          <div class="lbl">
            ENDING MESSAGE
            <span style="opacity:.5;font-size:9px">(shown after winning)</span>
          </div>
          <textarea class="field" id="msgAfter" rows="2" maxlength="200"
                    placeholder="e.g. Hope you liked it! 🎉"></textarea>
        </div>

        <div>
          <div class="lbl">DIFFICULTY FOR RECEIVER</div>
          <div class="diff-row">
            <button class="diff-btn de" id="de">EASY</button>
            <button class="diff-btn dm dsel" id="dm">MEDIUM</button>
            <button class="diff-btn dh" id="dh">HARD</button>
          </div>
        </div>

        <div class="status"     id="statusMsg"></div>
        <div class="err-inline" id="errorMsg"></div>

        <button class="main-btn" id="generateBtn" disabled>Generate link</button>

        <div id="linkCard" style="display:none" class="link-card">
          <div class="link-url" id="linkDisplay"></div>
          <button class="copy-btn" id="copyBtn">⎘ &nbsp;Copy link</button>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  // all constants inline — no external js/ dependency
  var IMGBB_UPLOAD_URL = 'https://api.imgbb.com/1/upload';

  function tick() { return new Promise(r => setTimeout(r, 30)); }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function resizeImage(dataUrl, maxPx) {
    return new Promise((resolve, reject) => {
      var img = new Image();
      img.onload = function() {
        var w = img.width, h = img.height;
        if (w > maxPx || h > maxPx) {
          if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
          else       { w = Math.round(w * maxPx / h); h = maxPx; }
        }
        var c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', 0.80));
      };
      img.onerror = reject;
      img.src = dataUrl;
    });
  }

  function copyToClipboard(text, btn) {
    var orig = btn.textContent;
    function flash() { btn.textContent = '✓  Copied!'; setTimeout(function(){ btn.textContent = orig; }, 2200); }
    navigator.clipboard.writeText(text).then(flash).catch(function() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta); flash();
    });
  }

  var base64Image  = null;
  var selectedDiff = 'medium';
  var keyVerified  = false;

  var apiKeyInput = document.getElementById('apiKey');
  var senderName  = document.getElementById('senderName');
  var msgBefore   = document.getElementById('msgBefore');
  var msgAfter    = document.getElementById('msgAfter');
  var uploadZone  = document.getElementById('uploadZone');
  var imgPreview  = document.getElementById('imgPreview');
  var fileInput   = document.getElementById('fileInput');
  var generateBtn = document.getElementById('generateBtn');
  var statusMsg   = document.getElementById('statusMsg');
  var errorMsg    = document.getElementById('errorMsg');
  var linkCard    = document.getElementById('linkCard');
  var linkDisplay = document.getElementById('linkDisplay');
  var copyBtn     = document.getElementById('copyBtn');
  var testBtn     = document.getElementById('testBtn');
  var keyStatus   = document.getElementById('keyStatus');

  function checkReady() {
    generateBtn.disabled = !(keyVerified && senderName.value.trim() && base64Image);
  }

  senderName.addEventListener('input', checkReady);

  apiKeyInput.addEventListener('input', function() {
    keyVerified = false;
    keyStatus.className   = 'key-status key-hint';
    keyStatus.textContent = 'Paste your key then tap Test to verify it works';
    checkReady();
  });

  testBtn.onclick = async function() {
    var key = apiKeyInput.value.trim();
    if (!key) {
      keyStatus.className   = 'key-status key-err';
      keyStatus.textContent = 'Please paste your API key first';
      return;
    }

    testBtn.textContent   = '…';
    testBtn.disabled      = true;
    keyStatus.className   = 'key-status key-hint';
    keyStatus.textContent = 'Testing…';

    // tiny 1x1 transparent png — raw base64, no data: prefix
    var tiny = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';

    try {
      var fd = new FormData();
      fd.append('key',   key);
      fd.append('image', tiny);

      var res = await fetch(IMGBB_UPLOAD_URL, { method: 'POST', body: fd });

      var result;
      try {
        result = await res.json();
      } catch(parseErr) {
        throw new Error('Server returned HTTP ' + res.status + ' (not JSON)');
      }

      if (result.success) {
        keyVerified           = true;
        keyStatus.className   = 'key-status key-ok';
        keyStatus.textContent = '✓ Key works! You\'re good to go.';
      } else {
        keyVerified           = false;
        keyStatus.className   = 'key-status key-err';
        var reason = (result.error && (result.error.message || result.error.code)) || JSON.stringify(result.error) || 'unknown';
        keyStatus.textContent = '✕ Key rejected: ' + reason;
      }
    } catch(err) {
      keyVerified           = false;
      keyStatus.className   = 'key-status key-err';
      keyStatus.textContent = '✕ Error: ' + err.message;
      console.error('imgbb test error:', err);
    }

    testBtn.textContent = 'Test';
    testBtn.disabled    = false;
    checkReady();
  };

  uploadZone.onclick = function() { fileInput.click(); };

  fileInput.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      base64Image              = ev.target.result;
      imgPreview.src           = base64Image;
      imgPreview.style.display = 'block';
      uploadZone.style.display = 'none';
      checkReady();
    };
    reader.readAsDataURL(file);
  };

  ['de','dm','dh'].forEach(function(id) {
    document.getElementById(id).onclick = function() {
      selectedDiff = { de:'easy', dm:'medium', dh:'hard' }[id];
      ['de','dm','dh'].forEach(function(x) {
        document.getElementById(x).classList.toggle('dsel', x === id);
      });
    };
  });

  generateBtn.onclick = async function() {
    var key  = apiKeyInput.value.trim();
    var name = senderName.value.trim();
    if (!key || !name || !base64Image) return;

    generateBtn.disabled = true;
    errorMsg.textContent = '';

    statusMsg.textContent = 'Resizing image…';
    await tick();

    var resized;
    try {
      resized = await resizeImage(base64Image, 800);
    } catch(e) {
      showErr('Could not process the image. Try a different file.');
      return;
    }

    statusMsg.textContent = 'Uploading image…';
    await tick();

    var fd = new FormData();
    fd.append('key',   key);
    fd.append('image', resized.split(',')[1]);

    var imgUrl;
    try {
      var res = await fetch(IMGBB_UPLOAD_URL, { method: 'POST', body: fd });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var result = await res.json();
      if (!result.success) throw new Error((result.error && result.error.message) || 'Upload rejected');
      imgUrl = result.data.url;
    } catch(err) {
      showErr('Upload failed: ' + err.message);
      return;
    }

    statusMsg.textContent = 'Building link…';
    await tick();

    var payload = JSON.stringify({
      img:       imgUrl,
      name:      name,
      msgBefore: msgBefore.value.trim(),
      msgAfter:  msgAfter.value.trim(),
      diff:      selectedDiff,
    });

    var encoded = LZString.compressToEncodedURIComponent(payload);
    // build the intro URL — works on both localhost and github pages
    var base = location.href.replace(/sender\.html.*$/, '');
    var url  = base + 'intro.html#data=' + encoded;

    statusMsg.textContent        = '';
    linkCard.style.display       = 'flex';
    linkCard.style.flexDirection = 'column';
    linkDisplay.textContent      = url;

    generateBtn.textContent = '✓ Link ready!';
    generateBtn.classList.add('green');
    generateBtn.disabled = false;

    copyBtn.onclick = function() { copyToClipboard(url, copyBtn); };
  };

  function showErr(msg) {
    errorMsg.textContent  = msg;
    statusMsg.textContent = '';
    generateBtn.disabled  = false;
  }
</script>
</body>
</html>
