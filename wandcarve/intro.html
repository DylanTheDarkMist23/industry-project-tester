<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>WandCarve — You got a spell</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
</head>
<body>

<div id="app">
  <div class="phone" id="phone">
    <!-- filled in by the script below -->
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script>

  const phone = document.getElementById('phone');

  // pull the payload out of the url hash
  const hash = location.hash.slice(1);

  if (!hash.startsWith('data=')) {
    showBroken();
  } else {
    let data;
    try {
      const json = LZString.decompressFromEncodedURIComponent(hash.slice(5));
      if (!json) throw new Error('empty');
      data = JSON.parse(json);
      if (!data.img) throw new Error('no image');
    } catch {
      showBroken();
      data = null;
    }

    if (data) renderIntro(data);
  }

  function renderIntro(data) {
    const { name, msgBefore } = data;

    phone.innerHTML = `
      <div class="screen">
        <div class="sbar"><span>9:41</span><span>● ● ●</span></div>

        <div class="intro-wrap">

          <div style="margin-bottom:18px">
            <svg width="44" height="130" viewBox="0 0 44 130">
              <defs>
                <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%"   stop-color="#8A5E30"/>
                  <stop offset="50%"  stop-color="#5C3D1E"/>
                  <stop offset="100%" stop-color="#8A5E30"/>
                </linearGradient>
              </defs>
              <rect x="13" y="16" width="18" height="100" rx="9" fill="url(#wg)"/>
              <circle cx="22" cy="12" r="12" fill="#E0B85A"/>
              <circle cx="17" cy="7"  r="4"  fill="white" opacity=".45"/>
              <rect x="9" y="110" width="26" height="11" rx="5.5" fill="#E0B85A"/>
              <rect x="20" y="28" width="4"  height="72" rx="2"  fill="#A07EE8" opacity=".45"/>
              <circle cx="22" cy="28" r="5" fill="#3AD98A"/>
              <circle cx="22" cy="96" r="4" fill="#3AD98A" opacity=".6"/>
            </svg>
          </div>

          <div class="intro-from">A WANDCARVE FROM</div>
          <div class="intro-name">${escapeHtml(name)}</div>
          <div class="intro-sent">sent you a surprise</div>

          <div class="intro-divider"></div>

          ${msgBefore
            ? `<div class="intro-msg">"${escapeHtml(msgBefore)}"</div>`
            : '<div style="height:8px"></div>'
          }

          <div class="intro-btns">
            <button class="main-btn" id="startBtn">✦ &nbsp;Start the spell</button>
            <button class="main-btn purple" id="howBtn">How to play</button>
          </div>

        </div>
      </div>`;

    // stash the payload in sessionStorage so howtoplay and game can grab it
    sessionStorage.setItem('wandcarve', JSON.stringify(data));

    document.getElementById('startBtn').onclick = () => {
      location.href = 'game.html';
    };

    document.getElementById('howBtn').onclick = () => {
      location.href = 'howtoplay.html';
    };
  }

  function showBroken() {
    phone.innerHTML = `
      <div class="screen">
        <div class="center-screen">
          <div style="font-size:44px">🪄</div>
          <div style="font-size:20px;font-weight:700">Broken link</div>
          <div style="font-size:13px;color:rgba(255,255,255,.45);line-height:1.55;max-width:260px">
            This WandCarve link appears to be corrupted or incomplete.
            Ask the sender to generate a new one.
          </div>
          <a href="sender.html" style="text-decoration:none">
            <button class="main-btn" style="max-width:210px">Create your own</button>
          </a>
        </div>
      </div>`;
  }

</script>
</body>
</html>
