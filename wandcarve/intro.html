<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="intro.css" />
    <title>WandCarve — You got a spell</title>
  </head>
  <body>
    <div id="app">
      <div class="phone">
        <!-- Intro screen (shown when link is valid) -->
        <div class="screen" id="intro-screen">
          <!-- Status bar -->
          <div class="sbar">
            <span>9:41</span>
            <span>● ● ●</span>
          </div>

          <!-- Centred content -->
          <div class="intro-wrap">
            <!-- Small wand SVG illustration -->
            <div id="wand-icon">
              <svg width="44" height="130" viewBox="0 0 44 130">
                <defs>
                  <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#8A5E30" />
                    <stop offset="50%" stop-color="#5C3D1E" />
                    <stop offset="100%" stop-color="#8A5E30" />
                  </linearGradient>
                </defs>
                <rect
                  x="13"
                  y="16"
                  width="18"
                  height="100"
                  rx="9"
                  fill="url(#wg)"
                />
                <circle cx="22" cy="12" r="12" fill="#E0B85A" />
                <circle cx="17" cy="7" r="4" fill="white" opacity=".45" />
                <rect
                  x="9"
                  y="110"
                  width="26"
                  height="11"
                  rx="5.5"
                  fill="#E0B85A"
                />
                <rect
                  x="20"
                  y="28"
                  width="4"
                  height="72"
                  rx="2"
                  fill="#A07EE8"
                  opacity=".45"
                />
                <circle cx="22" cy="28" r="5" fill="#3AD98A" />
                <circle cx="22" cy="96" r="4" fill="#3AD98A" opacity=".6" />
              </svg>
            </div>

            <!-- Sender info -->
            <div class="intro-from">A WANDCARVE FROM</div>
            <div class="intro-name" id="intro-name"></div>
            <div class="intro-sent" id="intro-sent"></div>

            <div class="intro-divider"></div>

            <!-- Sender's opening message (hidden if empty) -->
            <div class="intro-msg" id="intro-msg" style="display: none"></div>

            <!-- Action buttons -->
            <div class="intro-btns">
              <button class="main-btn" id="startBtn">
                ✦ &nbsp;Start the spell
              </button>
              <button class="main-btn purple" id="howBtn">How to play</button>
            </div>
          </div>
        </div>

        <!-- Broken link screen (shown when link is invalid) -->
        <div class="screen" id="broken-screen" style="display: none">
          <div class="center-screen">
            <div class="broken-emoji">🪄</div>
            <div class="broken-title">Broken link</div>
            <p class="broken-desc">
              This WandCarve link appears to be corrupted or incomplete. Ask the
              sender to generate a new one.
            </p>
            <a href="sender.html">
              <button class="main-btn broken-btn">Create your own</button>
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- lz-string to decode the payload from the URL hash -->
    <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
    <script src="intro.js"></script>
  </body>
</html>
