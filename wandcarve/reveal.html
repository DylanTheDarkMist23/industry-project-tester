<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>WandCarve — Rune Carved!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <div class="phone" id="phone"></div>
</div>

<script>
  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  var data = {};
  try { data = JSON.parse(sessionStorage.getItem('wandcarve') || '{}'); } catch(e) {}

  if (!data.img) {
    location.href = 'sender.html';
  } else {
    render(data);
  }

  function render(d) {
    var img      = d.img      || '';
    var msgAfter = d.msgAfter || '';
    var name     = d.name     || 'sender';

    document.getElementById('phone').innerHTML =
      '<div class="screen">' +
        '<div class="reveal-wrap">' +
          '<div class="sbar" style="width:100%"><span>9:41</span><span>● ● ●</span></div>' +
          '<div style="width:54px;height:54px;border-radius:50%;border:2px solid #3AD98A;' +
               'background:rgba(58,217,138,0.12);display:flex;align-items:center;' +
               'justify-content:center;font-size:24px;color:#3AD98A;">✓</div>' +
          '<div style="font-size:20px;font-weight:700;letter-spacing:2px;">RUNE CARVED!</div>' +
          '<img src="' + escapeHtml(img) + '" class="reveal-img" crossorigin="anonymous" ' +
               'alt="Surprise from ' + escapeHtml(name) + '" />' +
          (msgAfter ? '<div class="reveal-end-msg">"' + escapeHtml(msgAfter) + '"</div>' : '') +
          '<div class="reveal-ty">— Thank you for playing 🪄 —</div>' +
          '<button class="dl-btn" id="dlBtn">⬇ &nbsp;Save image</button>' +
          '<a href="sender.html" style="text-decoration:none">' +
            '<button class="ghost">← Send your own WandCarve</button>' +
          '</a>' +
        '</div>' +
      '</div>';

    document.getElementById('dlBtn').onclick = async function() {
      try {
        var blob = await fetch(img).then(function(r) { return r.blob(); });
        var url  = URL.createObjectURL(blob);
        var a    = document.createElement('a');
        a.href     = url;
        a.download = 'wandcarve-from-' + name.replace(/\s+/g, '-') + '.jpg';
        a.click();
        setTimeout(function() { URL.revokeObjectURL(url); }, 2000);
      } catch(e) {
        window.open(img, '_blank');
      }
    };
  }
</script>
</body>
</html>
