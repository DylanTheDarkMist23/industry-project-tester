<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>WandCarve — Carve the spell</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <div class="phone">
    <div class="screen">

      <div class="sbar"><span>9:41</span><span>● ● ●</span></div>

      <div class="g-hint" id="hint">Tap the green dot to begin</div>
      <div class="g-seg"  id="segCounter"></div>

      <canvas id="gameCanvas" width="340" height="440"></canvas>

      <div class="timer-wrap">
        <div class="timer-bar">
          <div class="timer-fill" id="timerFill" style="width:100%"></div>
        </div>
        <div class="timer-lbl" id="timerLabel"></div>
      </div>

    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script>

  // grab the payload that was stashed on the intro screen
  let gameData;
  try {
    gameData = JSON.parse(sessionStorage.getItem('wandcarve') || '{}');
  } catch {
    gameData = {};
  }

  if (!gameData.img) {
    // nothing to play — send them back
    location.href = 'sender.html';
  }

  const { diff = 'medium', img, msgAfter = '', name = '' } = gameData;
  const cfg = DIFFICULTY_CONFIG[diff] || DIFFICULTY_CONFIG.medium;

  const canvas      = document.getElementById('gameCanvas');
  const ctx         = canvas.getContext('2d');
  const hint        = document.getElementById('hint');
  const segCounter  = document.getElementById('segCounter');
  const timerFill   = document.getElementById('timerFill');
  const timerLabel  = document.getElementById('timerLabel');

  // set the initial timer colour
  timerFill.style.background = COLORS.groove;
  timerLabel.style.color     = COLORS.groove;
  timerLabel.textContent     = GAME_TIME_SECONDS + 's remaining';
  segCounter.style.color     = cfg.col;
  segCounter.textContent     = 'SEGMENT 1 OF ' + GROOVE_SEGMENTS.length;

  let segIndex     = 0;
  let tracing      = false;
  let started      = false;
  let won          = false;
  let failed       = false;
  let tracePath    = [];
  let donePaths    = [];
  let timeLeft     = GAME_TIME_SECONDS;
  let countdown    = null;
  let raf          = null;

  function updateSeg() {
    segCounter.textContent = 'SEGMENT ' + (segIndex + 1) + ' OF ' + GROOVE_SEGMENTS.length;
  }

  function startTimer() {
    if (countdown) return;
    countdown = setInterval(() => {
      timeLeft--;
      timerFill.style.width = (timeLeft / GAME_TIME_SECONDS * 100) + '%';

      const col = timeLeft <= 10 ? COLORS.danger
                : timeLeft <= 20 ? COLORS.accent
                : COLORS.groove;

      timerFill.style.background = col;
      timerLabel.style.color     = col;
      timerLabel.textContent     = timeLeft + 's remaining';

      if (timeLeft <= 0) {
        clearInterval(countdown);
        triggerFail();
      }
    }, 1000);
  }

  function triggerFail() {
    if (won || failed) return;
    failed  = true;
    tracing = false;
    clearInterval(countdown);
    cancelAnimationFrame(raf);
    setTimeout(() => {
      location.href = 'fail.html';
    }, 650);
  }

  function completeSegment() {
    donePaths.push([...tracePath]);
    tracePath = [];
    tracing   = false;

    if (segIndex >= GROOVE_SEGMENTS.length - 1) {
      won = true;
      clearInterval(countdown);
      cancelAnimationFrame(raf);
      setTimeout(() => {
        location.href = 'reveal.html';
      }, 800);
    } else {
      segIndex++;
      updateSeg();
      hint.textContent = 'Segment ' + (segIndex + 1) + ' unlocked — tap the green dot';
    }
  }

  function draw() {
    ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

    // wand shaft
    const shaft = ctx.createLinearGradient(156, 0, 184, 0);
    shaft.addColorStop(0,   COLORS.wandLight);
    shaft.addColorStop(0.5, COLORS.wand);
    shaft.addColorStop(1,   COLORS.wandLight);
    drawRoundedRect(ctx, 156, 36, 28, 380, 14, shaft);

    // handle
    const handle = ctx.createLinearGradient(146, 0, 194, 0);
    handle.addColorStop(0,   '#B38010');
    handle.addColorStop(0.5, COLORS.accent);
    handle.addColorStop(1,   '#B38010');
    drawRoundedRect(ctx, 146, 410, 48, 18, 9, handle);

    // tip orb
    ctx.beginPath();
    ctx.arc(170, 32, 17, 0, Math.PI * 2);
    ctx.fillStyle = won ? COLORS.success : COLORS.accent;
    ctx.fill();

    ctx.beginPath();
    ctx.arc(163, 26, 5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fill();

    // already-completed traces
    donePaths.forEach(p => drawPolyline(ctx, p, 7, COLORS.groove, false));

    // faint guide for current segment
    if (!won) {
      const seg = GROOVE_SEGMENTS[segIndex];
      drawPolyline(ctx, [seg[0], seg[1]], 7, COLORS.grooveDim, false);
    }

    // live trace
    if (tracePath.length > 1) {
      drawPolyline(ctx, tracePath, 7, failed ? COLORS.danger : COLORS.groove, !failed);
    }

    // finger cursor dot
    if (tracing && tracePath.length > 0) {
      const last = tracePath[tracePath.length - 1];
      ctx.beginPath();
      ctx.arc(last.x, last.y, 20, 0, Math.PI * 2);
      ctx.fillStyle = failed ? 'rgba(232,85,85,0.18)' : 'rgba(160,126,232,0.18)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(last.x, last.y, 9, 0, Math.PI * 2);
      ctx.fillStyle = failed ? COLORS.danger : COLORS.groove;
      ctx.fill();
    }

    // start and end dots
    if (!won && !failed) {
      const seg   = GROOVE_SEGMENTS[segIndex];
      const start = seg[0];
      const end   = seg[1];

      const sp = 0.5 + 0.5 * Math.sin(Date.now() / 350);
      const ep = 0.5 + 0.5 * Math.sin(Date.now() / 400 + 1);

      if (!tracing) {
        ctx.beginPath();
        ctx.arc(start.x, start.y, 18 + sp * 6, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(58,217,138,${0.07 + sp * 0.10})`;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(start.x, start.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(58,217,138,0.20)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(start.x, start.y, 7, 0, Math.PI * 2);
        ctx.fillStyle = COLORS.success;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(start.x - 2, start.y - 2, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.fill();

        ctx.fillStyle = COLORS.success;
        ctx.font      = 'bold 10px system-ui';
        ctx.textAlign = 'center';
        ctx.fillText(segIndex === 0 ? 'START HERE' : 'CONTINUE', start.x, start.y + 28);
      }

      ctx.beginPath();
      ctx.arc(end.x, end.y, cfg.endR, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(58,217,138,${0.30 + ep * 0.25})`;
      ctx.lineWidth   = 2;
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(end.x, end.y, 6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(58,217,138,0.75)';
      ctx.fill();

      ctx.fillStyle = 'rgba(58,217,138,0.85)';
      ctx.font      = 'bold 10px system-ui';
      ctx.textAlign = 'center';
      ctx.fillText(
        segIndex === GROOVE_SEGMENTS.length - 1 ? 'FINISH' : 'NEXT',
        end.x + 20, end.y + 4
      );
    }

    raf = requestAnimationFrame(draw);
  }

  raf = requestAnimationFrame(draw);

  function onDown(e) {
    e.preventDefault();
    if (won || failed || tracing) return;

    const pos   = getPointerPosition(e, canvas);
    const start = GROOVE_SEGMENTS[segIndex][0];
    if (Math.hypot(pos.x - start.x, pos.y - start.y) > cfg.startR) return;

    tracing = true;
    if (!started) { started = true; startTimer(); }
    tracePath = [pos];
    hint.textContent = 'Trace to the green endpoint';
  }

  function onMove(e) {
    e.preventDefault();
    if (!tracing || won || failed) return;

    const pos = getPointerPosition(e, canvas);
    const seg = GROOVE_SEGMENTS[segIndex];

    if (distancePointToSegment(pos, seg[0], seg[1]) > cfg.tol) {
      tracePath.push(pos);
      triggerFail();
      return;
    }

    tracePath.push(pos);

    if (Math.hypot(pos.x - seg[1].x, pos.y - seg[1].y) <= cfg.endR) {
      completeSegment();
    }
  }

  function onUp(e) {
    e.preventDefault();
    tracing = false;
  }

  canvas.addEventListener('mousedown',  onDown, { passive: false });
  canvas.addEventListener('mousemove',  onMove, { passive: false });
  canvas.addEventListener('mouseup',    onUp);
  canvas.addEventListener('mouseleave', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove',  onMove, { passive: false });
  canvas.addEventListener('touchend',   onUp);

</script>
</body>
</html>
