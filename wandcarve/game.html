<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="game.css" />
    <title>WandCarve — Carve the spell</title>
  </head>
  <body>
    <div id="app">
      <div class="phone">
        <div class="screen">
          <!-- Status bar -->
          <div class="sbar">
            <span>9:41</span>
            <span>● ● ●</span>
          </div>

          <!-- Hint text and segment counter -->
          <div id="hint">Tap the green dot to begin</div>
          <div id="segCounter"></div>

          <!-- Game canvas -->
          <canvas id="gameCanvas" width="340" height="440"></canvas>

          <!-- Timer bar -->
          <div id="timer-wrap">
            <div id="timer-bar">
              <div id="timer-fill" style="width: 100%"></div>
            </div>
            <div id="timer-label"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
