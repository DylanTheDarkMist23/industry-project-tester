
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
#root{width:320px;margin:0 auto;background:#120F1E;border-radius:24px;overflow:hidden;box-shadow:0 0 50px rgba(138,103,204,0.18);font-family:system-ui,sans-serif;user-select:none;}
button{cursor:pointer;font-family:inherit;}
canvas{display:block;touch-action:none;}
</style>

<div id="root"></div>

<script>
const W=320, TOTAL_TIME=60, TOL=13, END_RADIUS=14, START_RADIUS=14;

const C={
  bg:"#120F1E",bgP:"#1C1530",wand:"#5C3D1E",wandL:"#8A5E30",
  groove:"#A07EE8",grooveDim:"rgba(160,126,232,0.28)",
  accent:"#E0B85A",success:"#3AD98A",danger:"#E85555",
  w:"#FFFFFF",w70:"rgba(255,255,255,0.70)",w40:"rgba(255,255,255,0.40)",w15:"rgba(255,255,255,0.10)"
};

// Each segment is a pair of points [start, end]
// Only the CURRENT segment is visible at a time
const SEGMENTS = [
  [{x:160,y:46},  {x:157,y:133}],
  [{x:157,y:133}, {x:153,y:220}],
  [{x:153,y:220}, {x:160,y:307}],
  [{x:160,y:307}, {x:163,y:360}],
  [{x:163,y:360}, {x:160,y:400}],
];

function distSeg(p,a,b){
  const dx=b.x-a.x,dy=b.y-a.y;
  if(!dx&&!dy)return Math.hypot(p.x-a.x,p.y-a.y);
  const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy)));
  return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));
}

// Distance from point to a single segment
function distToSeg(p, seg){
  return distSeg(p, seg[0], seg[1]);
}

// Progress along a single segment (0–1)
function segProgress(p, seg){
  const a=seg[0], b=seg[1];
  const dx=b.x-a.x, dy=b.y-a.y;
  const len=Math.hypot(dx,dy);
  if(!len) return 0;
  const t=((p.x-a.x)*dx+(p.y-a.y)*dy)/(len*len);
  return Math.max(0,Math.min(1,t));
}

function mk(tag,css,parent,html){
  const e=document.createElement(tag);
  if(css)Object.assign(e.style,css);
  if(html!==undefined)e.innerHTML=html;
  if(parent)parent.appendChild(e);
  return e;
}
function btn(label,bg,fg,w,h,parent,cb){
  const b=mk('button',{width:typeof w==='number'?w+'px':w,height:h+'px',background:bg,color:fg,border:'none',borderRadius:(h/2)+'px',fontSize:'13px',fontWeight:'700',letterSpacing:'1px',display:'block',margin:'0 auto'},parent,label);
  b.onclick=cb;return b;
}
function sbar(p){
  const s=mk('div',{display:'flex',justifyContent:'space-between',padding:'10px 16px 2px',fontSize:'12px',color:C.w40},p);
  mk('span',{},s,'9:41');mk('span',{},s,'● ● ●');
}
function rr(ctx,x,y,w,h,r,fill){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();
}
function sp(ctx,pts,lw,color,glow){
  if(pts.length<2)return;
  if(glow){
    ctx.save();ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
    ctx.strokeStyle='rgba(160,126,232,0.18)';ctx.lineWidth=lw+12;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();ctx.restore();
  }
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);
  ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
}

const root=document.getElementById('root');
function clear(){root.innerHTML='';}

// ── START ─────────────────────────────────────────────────────────────────────
function showStart(){
  clear();
  const sc=mk('div',{height:'560px',display:'flex',flexDirection:'column',alignItems:'center',padding:'0 24px'},root);
  sbar(sc);
  const body=mk('div',{flex:'1',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'},sc);
  body.innerHTML=`<svg width="50" height="160" style="margin-bottom:14px">
    <defs><linearGradient id="wg0" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="${C.wandL}"/><stop offset="50%" stop-color="${C.wand}"/><stop offset="100%" stop-color="${C.wandL}"/></linearGradient></defs>
    <rect x="16" y="14" width="18" height="126" rx="9" fill="url(#wg0)"/>
    <circle cx="25" cy="10" r="11" fill="${C.accent}"/>
    <circle cx="20" cy="6" r="4" fill="white" opacity=".45"/>
    <rect x="11" y="134" width="28" height="11" rx="5.5" fill="${C.accent}"/>
    <line x1="25" y1="24" x2="25" y2="130" stroke="${C.groove}" stroke-width="4" stroke-linecap="round" opacity=".55"/>
    <circle cx="25" cy="24" r="5" fill="${C.success}"/>
    <circle cx="25" cy="130" r="4" fill="${C.success}" opacity=".7"/>
  </svg>`;
  mk('div',{fontSize:'24px',fontWeight:'700',color:C.w,letterSpacing:'3px',marginBottom:'6px'},body,'WANDCRAFT');
  mk('div',{fontSize:'12px',color:C.w70,marginBottom:'14px'},body,'Carve the rune. Feel the magic.');
  mk('div',{width:'36px',height:'2px',background:C.accent,borderRadius:'1px',margin:'0 auto 10px'},body);

  // 3 difficulty buttons
  mk('div',{fontSize:'10px',color:C.w40,marginBottom:'12px',letterSpacing:'2px',textAlign:'center'},body,'CHOOSE DIFFICULTY');
  const diffs=[
    {label:'EASY',  sub:'Wide groove',    bg:'rgba(58,217,138,0.12)', border:C.success, col:C.success},
    {label:'MEDIUM',sub:'Standard',       bg:'rgba(224,184,90,0.12)', border:C.accent,  col:C.accent},
    {label:'HARD',  sub:'Tight & precise',bg:'rgba(232,85,85,0.12)',  border:C.danger,  col:C.danger},
  ];
  diffs.forEach(d=>{
    const row=mk('div',{display:'flex',flexDirection:'column',gap:'4px',width:'100%',marginBottom:'8px'},body);
    const b=mk('button',{
      width:'100%',height:'52px',background:d.bg,color:d.col,
      border:`1.5px solid ${d.border}`,borderRadius:'26px',
      fontSize:'14px',fontWeight:'700',letterSpacing:'1px',
      display:'flex',alignItems:'center',justifyContent:'center',gap:'10px',
      cursor:'pointer',padding:'0 20px'
    },row);
    mk('span',{fontSize:'9px',fontWeight:'700',letterSpacing:'1px',opacity:'0.7'},b,'●');
    const txt=mk('div',{display:'flex',flexDirection:'column',alignItems:'flex-start'},b);
    mk('span',{},txt,d.label);
    mk('span',{fontSize:'10px',fontWeight:'400',color:C.w40,letterSpacing:'0'},txt,d.sub);
    b.onclick=()=>showGame(d.label.toLowerCase());
  });

  mk('div',{fontSize:'11px',color:C.w40,textAlign:'center',paddingBottom:'18px'},sc,'Trace the groove — one segment unlocks at a time');
}

// ── HOW TO PLAY ───────────────────────────────────────────────────────────────
function showHowTo(){
  clear();
  const sc=mk('div',{height:'560px',display:'flex',flexDirection:'column'},root);
  sbar(sc);
  const hdr=mk('div',{display:'flex',alignItems:'center',padding:'6px 16px 4px'},sc);
  const bb=mk('button',{background:C.w15,border:'none',color:C.w70,borderRadius:'16px',padding:'5px 12px',fontSize:'12px',cursor:'pointer'},hdr,'← Back');
  bb.onclick=showStart;
  mk('div',{flex:'1',textAlign:'center',fontSize:'14px',fontWeight:'700',color:C.w,letterSpacing:'1px'},hdr,'HOW TO PLAY');
  mk('div',{width:'36px'},hdr);
  mk('div',{width:'36px',height:'2px',background:C.accent,borderRadius:'1px',margin:'0 auto 10px'},sc);
  const body=mk('div',{flex:'1',overflowY:'auto',padding:'0 14px',display:'flex',flexDirection:'column',gap:'7px'},sc);
  [{c:C.groove,n:'01',i:'👁',t:'One segment at a time',d:'Only the current piece of the groove is shown. Complete it to reveal the next.'},
   {c:C.success,n:'02',i:'☝',t:'Start at the green dot',d:'Tap the glowing green circle just below the wand tip to begin the first segment.'},
   {c:C.groove,n:'03',i:'↓',t:'Trace to the segment end',d:'Drag your finger to the green endpoint of the current segment to unlock the next one.'},
   {c:C.danger,n:'04',i:'⚡',t:"Don't leave the path",d:'Leaving the groove breaks the spell — instant fail. No shortcuts!'},
   {c:C.success,n:'05',i:'✓',t:'Complete all segments',d:'Finish every segment in order and the rune activates. You win!'},
  ].forEach(s=>{
    const card=mk('div',{background:C.w15,borderRadius:'12px',padding:'10px 12px',display:'flex',gap:'10px'},body);
    card.style.borderLeft=`3px solid ${s.c}`;
    const left=mk('div',{display:'flex',flexDirection:'column',alignItems:'center',minWidth:'28px',gap:'3px'},card);
    mk('div',{fontSize:'9px',fontWeight:'700',color:s.c,letterSpacing:'1px'},left,s.n);
    mk('div',{fontSize:'16px'},left,s.i);
    const right=mk('div',{},card);
    mk('div',{fontSize:'12px',fontWeight:'700',color:C.w,marginBottom:'2px'},right,s.t);
    mk('div',{fontSize:'10px',color:C.w70,lineHeight:'1.5'},right,s.d);
  });
  mk('div',{background:'rgba(224,184,90,0.10)',borderRadius:'10px',padding:'8px 12px',fontSize:'10px',color:C.accent,textAlign:'center'},body,`⏱  ${TOTAL_TIME} seconds — you cannot skip ahead`);
  const foot=mk('div',{padding:'10px 20px 18px'},sc);
  btn("GOT IT — LET'S GO",C.accent,C.bg,'100%',46,foot,()=>showGame('medium'));
}

// ── GAME ──────────────────────────────────────────────────────────────────────
function showGame(difficulty='medium'){
  clear();

  // Difficulty config
  const cfg = {
    easy:   {tol:20, endR:20, startR:20, color:C.success, label:'EASY'},
    medium: {tol:13, endR:14, startR:14, color:C.accent,  label:'MEDIUM'},
    hard:   {tol:8,  endR:10, startR:10, color:C.danger,  label:'HARD'},
  }[difficulty] || {tol:13, endR:14, startR:14, color:C.accent, label:'MEDIUM'};

  const sc=mk('div',{height:'560px',display:'flex',flexDirection:'column'},root);
  sbar(sc);

  // Hint at TOP
  const hint=mk('div',{textAlign:'center',fontSize:'11px',color:C.w40,padding:'4px 16px 0'},sc,'Tap the green dot to begin');

  // Segment counter
  const segCounter=mk('div',{textAlign:'center',fontSize:'10px',padding:'2px 0 4px',letterSpacing:'1px'},sc);

  // Canvas
  const canvasH=430;
  const wrap=mk('div',{flex:'1',position:'relative'},sc);
  const cvs=document.createElement('canvas');
  cvs.width=W;cvs.height=canvasH;
  cvs.style.cssText='display:block;touch-action:none;';
  wrap.appendChild(cvs);

  // Timer
  const timerWrap=mk('div',{padding:'4px 18px 10px',display:'flex',flexDirection:'column',gap:'3px'},sc);
  const timerTrack=mk('div',{height:'4px',background:'rgba(255,255,255,0.08)',borderRadius:'2px'},timerWrap);
  const timerFill=mk('div',{height:'4px',width:'100%',background:C.groove,borderRadius:'2px',transition:'width 1s linear, background 0.5s'},timerTrack);
  const timerLbl=mk('div',{textAlign:'center',fontSize:'10px',color:C.groove},timerWrap,TOTAL_TIME+'s remaining');

  const ctx=cvs.getContext('2d');

  // ── State ─────────────────────────────────────────────────────────────────
  let currentSeg = 0;          // which segment is active
  let tracing = false;
  let gameStarted = false;     // first tap on start dot
  let done = false, failed = false;
  let tracedPts = [];          // points traced on current segment
  let completedSegs = [];      // array of traced point arrays, one per finished segment
  let timeLeft = TOTAL_TIME;
  let timerID = null, rafID = null;

  function updateCounter(){
    segCounter.textContent = `SEGMENT ${currentSeg+1} OF ${SEGMENTS.length}`;
    segCounter.style.color = cfg.color;
  }
  updateCounter();

  function startTimer(){
    if(timerID)return;
    timerID=setInterval(()=>{
      timeLeft--;
      const pct=(timeLeft/TOTAL_TIME)*100;
      timerFill.style.width=pct+'%';
      const tc=timeLeft<=10?C.danger:timeLeft<=20?C.accent:C.groove;
      timerFill.style.background=tc;timerLbl.style.color=tc;
      timerLbl.textContent=timeLeft+'s remaining';
      if(timeLeft<=0){clearInterval(timerID);doFail();}
    },1000);
  }

  function doFail(){
    if(done||failed)return;
    failed=true;tracing=false;
    clearInterval(timerID);cancelAnimationFrame(rafID);
    setTimeout(showFail,650);
  }

  function doSuccess(){
    if(done||failed)return;
    done=true;tracing=false;
    clearInterval(timerID);cancelAnimationFrame(rafID);
    setTimeout(showSuccess,750);
  }

  // Called when player reaches end of current segment
  function completeSegment(){
    // Save the traced path for this segment
    completedSegs.push([...tracedPts]);
    tracedPts=[];
    tracing=false;

    if(currentSeg >= SEGMENTS.length-1){
      // All segments done!
      doSuccess();
    } else {
      // Advance to next segment
      currentSeg++;
      updateCounter();
      hint.textContent=`Segment ${currentSeg+1} unlocked — tap the green dot`;
    }
  }

  function draw(){
    ctx.clearRect(0,0,W,canvasH);

    // Wand shaft
    const wg=ctx.createLinearGradient(146,0,174,0);
    wg.addColorStop(0,C.wandL);wg.addColorStop(0.5,C.wand);wg.addColorStop(1,C.wandL);
    rr(ctx,146,36,28,374,14,wg);

    // Handle
    const hg=ctx.createLinearGradient(136,0,184,0);
    hg.addColorStop(0,'#B38010');hg.addColorStop(0.5,C.accent);hg.addColorStop(1,'#B38010');
    rr(ctx,136,410,48,18,9,hg);

    // Tip orb
    ctx.beginPath();ctx.arc(160,32,17,0,Math.PI*2);
    ctx.fillStyle=done?C.success:C.accent;ctx.fill();
    ctx.beginPath();ctx.arc(153,26,5,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fill();

    // ── Draw completed segments in groove colour ──────────────────────────
    completedSegs.forEach(pts=>sp(ctx,pts,7,C.groove,false));

    // ── Draw ONLY the current segment's groove (dim) ──────────────────────
    if(!done){
      const seg=SEGMENTS[currentSeg];
      sp(ctx,[seg[0],seg[1]],7,C.grooveDim,false);
    }

    // ── Current trace (in progress) ───────────────────────────────────────
    if(tracedPts.length>1)
      sp(ctx,tracedPts,7,failed?C.danger:C.groove,!failed);

    // ── Finger dot ────────────────────────────────────────────────────────
    if(tracing&&tracedPts.length>0){
      const lp=tracedPts[tracedPts.length-1];
      ctx.beginPath();ctx.arc(lp.x,lp.y,20,0,Math.PI*2);
      ctx.fillStyle=failed?'rgba(232,85,85,0.18)':'rgba(160,126,232,0.18)';ctx.fill();
      ctx.beginPath();ctx.arc(lp.x,lp.y,9,0,Math.PI*2);
      ctx.fillStyle=failed?C.danger:C.groove;ctx.fill();
    }

    if(!done&&!failed){
      const seg=SEGMENTS[currentSeg];
      const START=seg[0];
      const END=seg[1];
      const isFirst=(currentSeg===0);
      const pulse=0.5+0.5*Math.sin(Date.now()/350);

      // ── START dot — green pulsing beacon (only shown if not yet tracing this seg)
      if(!tracing){
        // Outer pulse ring
        ctx.beginPath();ctx.arc(START.x,START.y,18+pulse*6,0,Math.PI*2);
        ctx.fillStyle=`rgba(58,217,138,${0.07+pulse*0.10})`;ctx.fill();
        // Mid ring
        ctx.beginPath();ctx.arc(START.x,START.y,12,0,Math.PI*2);
        ctx.fillStyle='rgba(58,217,138,0.20)';ctx.fill();
        // Core dot — green
        ctx.beginPath();ctx.arc(START.x,START.y,7,0,Math.PI*2);
        ctx.fillStyle=C.success;ctx.fill();
        ctx.beginPath();ctx.arc(START.x-2,START.y-2,2.5,0,Math.PI*2);
        ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fill();
        if(isFirst||currentSeg>0){
          ctx.fillStyle=C.success;ctx.font='bold 10px system-ui';ctx.textAlign='center';
          ctx.fillText(currentSeg===0?'START HERE':'CONTINUE',START.x,START.y+(currentSeg===0?28:28));
        }
      }

      // ── END dot — green target for current segment ─────────────────────
      const pulse2=0.5+0.5*Math.sin(Date.now()/400+1);
      // Ring showing hitzone
      ctx.beginPath();ctx.arc(END.x,END.y,cfg.endR,0,Math.PI*2);
      ctx.strokeStyle=`rgba(58,217,138,${0.30+pulse2*0.25})`;ctx.lineWidth=2;ctx.stroke();
      // Solid dot
      ctx.beginPath();ctx.arc(END.x,END.y,6,0,Math.PI*2);
      ctx.fillStyle='rgba(58,217,138,0.75)';ctx.fill();
      // Label
      const isLast=(currentSeg===SEGMENTS.length-1);
      ctx.fillStyle='rgba(58,217,138,0.85)';ctx.font='bold 10px system-ui';ctx.textAlign='center';
      ctx.fillText(isLast?'FINISH':'NEXT',END.x+18,END.y+4);
    }

    rafID=requestAnimationFrame(draw);
  }
  rafID=requestAnimationFrame(draw);

  function pos(e){
    const r=cvs.getBoundingClientRect();
    const src=e.touches?e.touches[0]:e;
    return {x:src.clientX-r.left,y:src.clientY-r.top};
  }

  cvs.addEventListener('mousedown',dn,{passive:false});
  cvs.addEventListener('touchstart',dn,{passive:false});
  cvs.addEventListener('mousemove',mv,{passive:false});
  cvs.addEventListener('touchmove',mv,{passive:false});
  cvs.addEventListener('mouseup',up);
  cvs.addEventListener('touchend',up);
  cvs.addEventListener('mouseleave',up);

  function dn(e){
    e.preventDefault();
    if(done||failed||tracing)return;
    const p=pos(e);
    const START=SEGMENTS[currentSeg][0];
    // Must tap on the start dot of the current segment
    if(Math.hypot(p.x-START.x,p.y-START.y)>cfg.startR)return;
    tracing=true;
    if(!gameStarted){gameStarted=true;startTimer();}
    tracedPts=[p];
    hint.textContent='Trace to the green endpoint';
  }

  function mv(e){
    e.preventDefault();
    if(!tracing||done||failed)return;
    const p=pos(e);
    const seg=SEGMENTS[currentSeg];

    // Must stay on current segment only
    if(distToSeg(p,seg)>cfg.tol){
      tracedPts.push(p);
      doFail();
      return;
    }
    tracedPts.push(p);

    // Check if reached the end of this segment
    const END=seg[1];
    if(Math.hypot(p.x-END.x,p.y-END.y)<=cfg.endR){
      completeSegment();
    }
  }

  function up(e){
    e.preventDefault();
    tracing=false;
  }
}

// ── SUCCESS ───────────────────────────────────────────────────────────────────
function showSuccess(){
  clear();
  const sc=mk('div',{height:'560px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 24px'},root);
  sbar(sc);
  const body=mk('div',{flex:'1',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'},sc);
  body.innerHTML=`<svg width="50" height="150" style="margin-bottom:14px">
    <defs><linearGradient id="swg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="${C.wandL}"/><stop offset="50%" stop-color="${C.wand}"/><stop offset="100%" stop-color="${C.wandL}"/></linearGradient></defs>
    <rect x="16" y="14" width="18" height="116" rx="9" fill="url(#swg)"/>
    <line x1="25" y1="24" x2="25" y2="122" stroke="${C.success}" stroke-width="5" stroke-linecap="round"/>
    <circle cx="25" cy="10" r="11" fill="${C.success}"/>
    <rect x="10" y="126" width="30" height="11" rx="5.5" fill="${C.accent}"/>
  </svg>`;
  mk('div',{width:'56px',height:'56px',borderRadius:'50%',border:'2px solid '+C.success,background:'rgba(58,217,138,0.12)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'28px',color:C.success,marginBottom:'14px',lineHeight:'56px',textAlign:'center'},body,'✓');
  mk('div',{fontSize:'22px',fontWeight:'700',color:C.w,marginBottom:'5px'},body,'RUNE CARVED!');
  mk('div',{fontSize:'12px',color:C.w70,marginBottom:'20px'},body,'All segments complete — the magic flows.');
  btn('PLAY AGAIN',C.success,C.bg,190,46,body,showStart);
  mk('div',{height:'9px'},body);
  const bk=mk('button',{background:'none',border:'none',color:C.w40,fontSize:'12px',cursor:'pointer',display:'block',margin:'0 auto'},body,'Back to menu');
  bk.onclick=showStart;
}

// ── FAIL ──────────────────────────────────────────────────────────────────────
function showFail(){
  clear();
  const sc=mk('div',{height:'560px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'0 24px'},root);
  sbar(sc);
  const body=mk('div',{flex:'1',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center'},sc);
  body.innerHTML=`<svg width="50" height="150" style="margin-bottom:14px">
    <defs><linearGradient id="fwg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="${C.wandL}"/><stop offset="50%" stop-color="${C.wand}"/><stop offset="100%" stop-color="${C.wandL}"/></linearGradient></defs>
    <rect x="16" y="14" width="18" height="116" rx="9" fill="url(#fwg)"/>
    <line x1="25" y1="24" x2="25" y2="72" stroke="${C.danger}" stroke-width="5" stroke-linecap="round" opacity=".85"/>
    <line x1="25" y1="72" x2="25" y2="122" stroke="rgba(160,126,232,0.28)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="36" cy="72" r="8" fill="${C.danger}"/>
    <text x="36" y="77" text-anchor="middle" font-size="9" fill="#120F1E" font-weight="bold">!</text>
    <circle cx="25" cy="10" r="11" fill="${C.danger}" opacity=".75"/>
    <rect x="10" y="126" width="30" height="11" rx="5.5" fill="${C.wand}"/>
  </svg>`;
