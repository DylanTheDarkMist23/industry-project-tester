<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WandCraft</title>
<script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#0A0812;font-family:system-ui,-apple-system,sans-serif;color:#fff;}
#app{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding:20px 0 40px;}
.phone{width:340px;background:#120F1E;border-radius:28px;overflow:hidden;box-shadow:0 0 60px rgba(138,103,204,0.15);}
.screen{min-height:600px;display:flex;flex-direction:column;}
button{cursor:pointer;font-family:inherit;border:none;outline:none;}
canvas{display:block;touch-action:none;cursor:crosshair;}
input,textarea{font-family:inherit;}

.sbar{display:flex;justify-content:space-between;padding:12px 18px 4px;font-size:12px;color:rgba(255,255,255,0.32);}
.wrap{padding:18px 22px 30px;display:flex;flex-direction:column;gap:14px;}
.lbl{font-size:10px;color:rgba(255,255,255,0.38);letter-spacing:1px;margin-bottom:5px;}
.field{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.11);border-radius:11px;padding:11px 13px;font-size:13px;color:#fff;width:100%;}
.field::placeholder{color:rgba(255,255,255,0.28);}
.field:focus{outline:none;border-color:rgba(138,103,204,0.55);}
textarea.field{resize:none;}

.logo-title{font-size:22px;font-weight:700;letter-spacing:3px;text-align:center;margin-bottom:3px;}
.logo-sub{font-size:12px;color:rgba(255,255,255,0.42);text-align:center;}

/* API key row */
.key-row{display:flex;gap:8px;align-items:stretch;}
.key-row input{flex:1;}
.key-test-btn{height:auto;padding:0 12px;background:rgba(138,103,204,0.18);border:1px solid rgba(138,103,204,0.35);border-radius:11px;color:#A07EE8;font-size:11px;font-weight:600;white-space:nowrap;cursor:pointer;}
.key-test-btn:hover{background:rgba(138,103,204,0.30);}
.key-status{font-size:10px;min-height:14px;margin-top:4px;}
.key-ok  {color:#3AD98A;}
.key-err {color:#E85555;}
.key-hint{color:rgba(255,255,255,0.35);}

.upload-zone{border:1.5px dashed rgba(138,103,204,0.4);border-radius:14px;padding:20px 14px;text-align:center;cursor:pointer;background:rgba(138,103,204,0.04);transition:border-color 0.2s;}
.upload-zone:hover{border-color:rgba(138,103,204,0.75);}
.preview{width:100%;border-radius:11px;max-height:130px;object-fit:cover;display:none;}
#fileInput{display:none;}
.diff-row{display:flex;gap:7px;}
.diff-btn{flex:1;height:40px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:1px;border:1.5px solid;}
.de{background:rgba(58,217,138,.10);color:#3AD98A;border-color:rgba(58,217,138,.42);}
.dm{background:rgba(224,184,90,.10);color:#E0B85A;border-color:rgba(224,184,90,.42);}
.dh{background:rgba(232,85,85,.10);color:#E85555;border-color:rgba(232,85,85,.42);}
.dsel{border-width:2.5px!important;}
.main-btn{width:100%;height:50px;border-radius:25px;font-size:14px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:7px;background:#E0B85A;color:#120F1E;}
.main-btn:disabled{opacity:.32;cursor:not-allowed;}
.main-btn.green{background:#3AD98A;color:#0A0812;}
.main-btn.purple{background:#8A67CC;color:#fff;}
.link-card{background:rgba(138,103,204,.10);border:1px solid rgba(138,103,204,.25);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;}
.link-url{font-size:11px;color:rgba(255,255,255,.62);word-break:break-all;line-height:1.5;}
.copy-btn{height:40px;background:rgba(138,103,204,.18);border:1px solid rgba(138,103,204,.35);border-radius:20px;color:#A07EE8;font-size:13px;font-weight:600;width:100%;cursor:pointer;}
.status{font-size:10px;color:rgba(255,255,255,.33);text-align:center;min-height:14px;}
.err-inline{font-size:11px;color:#E85555;text-align:center;min-height:14px;line-height:1.4;}

.intro-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:600px;padding:32px 28px;text-align:center;}
.intro-from{font-size:11px;color:rgba(255,255,255,0.45);letter-spacing:2px;margin-bottom:8px;}
.intro-name{font-size:28px;font-weight:700;margin-bottom:4px;}
.intro-sent{font-size:12px;color:rgba(255,255,255,0.38);margin-bottom:22px;}
.intro-divider{width:40px;height:2px;background:#8A67CC;border-radius:1px;margin:0 auto 20px;}
.intro-msg{font-size:15px;color:rgba(255,255,255,0.82);line-height:1.7;font-style:italic;margin-bottom:26px;max-width:270px;}
.intro-btns{display:flex;flex-direction:column;gap:10px;width:100%;}

.g-hint{text-align:center;font-size:11px;color:rgba(255,255,255,.38);padding:4px 16px;}
.g-seg{text-align:center;font-size:10px;letter-spacing:1px;padding:1px 0 3px;}
.timer-wrap{padding:5px 18px 12px;display:flex;flex-direction:column;gap:3px;}
.timer-bar{height:4px;background:rgba(255,255,255,.08);border-radius:2px;}
.timer-fill{height:4px;border-radius:2px;transition:width 1s linear,background .5s;}
.timer-lbl{text-align:center;font-size:10px;}

.howto-wrap{display:flex;flex-direction:column;min-height:600px;}
.howto-body{flex:1;overflow-y:auto;padding:0 16px;display:flex;flex-direction:column;gap:8px;}
.step-card{background:rgba(255,255,255,0.07);border-radius:12px;padding:11px 13px;display:flex;gap:11px;align-items:flex-start;}
.step-title{font-size:12px;font-weight:700;color:#fff;margin-bottom:2px;}
.step-desc{font-size:10px;color:rgba(255,255,255,0.65);line-height:1.5;}
.tip-card{background:rgba(224,184,90,0.10);border-radius:10px;padding:9px 13px;font-size:10px;color:#E0B85A;text-align:center;}

.reveal-wrap{display:flex;flex-direction:column;align-items:center;padding:24px 22px 30px;gap:14px;text-align:center;min-height:600px;justify-content:center;}
.reveal-img{width:100%;max-height:210px;object-fit:cover;border-radius:14px;border:2px solid rgba(58,217,138,.38);}
.reveal-end-msg{font-size:15px;color:rgba(255,255,255,0.85);line-height:1.65;font-style:italic;max-width:270px;}
.reveal-ty{font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:1px;}
.dl-btn{width:100%;height:50px;background:#3AD98A;border-radius:25px;color:#0A0812;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;border:none;}
.ghost{background:none;border:none;color:rgba(255,255,255,.32);font-size:12px;text-decoration:underline;cursor:pointer;margin-top:-6px;}
.center-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:600px;padding:30px;text-align:center;gap:13px;}
</style>
</head>
<body>
<div id="app"><div class="phone" id="phone"></div></div>
<script>
const phone = document.getElementById('phone');
const IMGBB = 'https://api.imgbb.com/1/upload';

const C={wand:'#5C3D1E',wandL:'#8A5E30',groove:'#A07EE8',grooveDim:'rgba(160,126,232,0.28)',accent:'#E0B85A',success:'#3AD98A',danger:'#E85555'};
const SEGS=[
  [{x:170,y:50},{x:167,y:137}],
  [{x:167,y:137},{x:163,y:224}],
  [{x:163,y:224},{x:170,y:311}],
  [{x:170,y:311},{x:167,y:370}],
  [{x:167,y:370},{x:170,y:410}],
];

function route(){
  const raw=location.hash.slice(1);
  if(raw.startsWith('play=')){
    try{
      const json=LZString.decompressFromEncodedURIComponent(raw.slice(5));
      if(!json)throw 0;
      const d=JSON.parse(json);
      if(!d.img)throw 0;
      showIntro(d);
    }catch(e){showError('Broken link','Ask the sender to generate a new one.');}
  }else{showSender();}
}
window.addEventListener('hashchange',route);

// ── SENDER ───────────────────────────────────────────────────────────────────
function showSender(){
  let imageB64=null,diff='medium';

  phone.innerHTML=`
  <div class="screen">
    <div class="sbar"><span>9:41</span><span>● ● ●</span></div>
    <div class="wrap">
      <div>
        <div class="logo-title">WANDCRAFT</div>
        <div class="logo-sub">Lock a surprise behind a spell</div>
      </div>

      <div>
        <div class="lbl">IMGBB API KEY &nbsp;<a href="https://api.imgbb.com" target="_blank" style="font-size:10px;color:#8A67CC;text-decoration:none;">Get free key ↗</a></div>
        <div class="key-row">
          <input class="field" id="apiKey" type="password" placeholder="Paste your API key here…" autocomplete="off"/>
          <button class="key-test-btn" id="testBtn">Test</button>
        </div>
        <div class="key-status key-hint" id="keyStatus">Paste your key then tap Test to verify it works</div>
      </div>

      <div>
        <div class="lbl">YOUR NAME</div>
        <input class="field" id="senderName" type="text" placeholder="Enter a name the receiver will know" maxlength="40"/>
      </div>

      <div>
        <div class="lbl">BEGINNING MESSAGE <span style="opacity:.5;font-size:9px">(shown before the game)</span></div>
        <textarea class="field" id="msgBefore" rows="2" maxlength="200" placeholder="e.g. I have a little something for you…"></textarea>
      </div>

      <div>
        <div class="lbl">YOUR IMAGE</div>
        <div class="upload-zone" id="zone">
          <div style="font-size:24px;color:#8A67CC;margin-bottom:5px">⬆</div>
          <div style="font-size:13px;color:rgba(255,255,255,.46)">Tap to choose a photo</div>
        </div>
        <img class="preview" id="prev" alt="preview"/>
        <input type="file" id="fileInput" accept="image/*"/>
      </div>

      <div>
        <div class="lbl">ENDING MESSAGE <span style="opacity:.5;font-size:9px">(shown after winning)</span></div>
        <textarea class="field" id="msgAfter" rows="2" maxlength="200" placeholder="e.g. Hope you liked it! 🎉"></textarea>
      </div>

      <div>
        <div class="lbl">DIFFICULTY FOR RECEIVER</div>
        <div class="diff-row">
          <button class="diff-btn de" id="de">EASY</button>
          <button class="diff-btn dm dsel" id="dm">MEDIUM</button>
          <button class="diff-btn dh" id="dh">HARD</button>
        </div>
      </div>

      <div class="status" id="status"></div>
      <div class="err-inline" id="errMsg"></div>

      <button class="main-btn" id="genBtn" disabled>Generate link</button>

      <div id="linkCard" style="display:none" class="link-card">
        <div class="link-url" id="linkUrl"></div>
        <button class="copy-btn" id="copyBtn">⎘ &nbsp;Copy link</button>
      </div>
    </div>
  </div>`;

  const $=id=>phone.querySelector('#'+id);
  const apiKeyEl=$('apiKey'),nameEl=$('senderName'),beforeEl=$('msgBefore'),afterEl=$('msgAfter');
  const zone=$('zone'),prev=$('prev'),fi=$('fileInput');
  const genBtn=$('genBtn'),statusEl=$('status'),errEl=$('errMsg');
  const linkCard=$('linkCard'),linkUrl=$('linkUrl'),copyBtn=$('copyBtn');
  const testBtn=$('testBtn'),keyStatus=$('keyStatus');

  let keyVerified=false;

  function checkReady(){genBtn.disabled=!(keyVerified&&nameEl.value.trim()&&imageB64);}
  nameEl.addEventListener('input',checkReady);

  // Reset key verification whenever the key changes
  apiKeyEl.addEventListener('input',()=>{
    keyVerified=false;
    keyStatus.className='key-status key-hint';
    keyStatus.textContent='Paste your key then tap Test to verify it works';
    checkReady();
  });

  // Test key by uploading a tiny 1×1 pixel image
  testBtn.onclick=async()=>{
    const key=apiKeyEl.value.trim();
    if(!key){keyStatus.className='key-status key-err';keyStatus.textContent='Please paste your API key first';return;}
    testBtn.textContent='…';testBtn.disabled=true;
    keyStatus.className='key-status key-hint';keyStatus.textContent='Testing…';
    // 1×1 transparent PNG base64
    const tiny='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==';
    try{
      const fd=new FormData();
      fd.append('key',key);
      fd.append('image',tiny);
      // DO NOT set Content-Type header — let browser set it with boundary automatically
      const res=await fetch(IMGBB,{method:'POST',body:fd});
      const json=await res.json();
      if(json.success){
        keyVerified=true;
        keyStatus.className='key-status key-ok';
        keyStatus.textContent='✓ Key works! You\'re good to go.';
      }else{
        keyVerified=false;
        keyStatus.className='key-status key-err';
        keyStatus.textContent='✕ Key rejected: '+(json.error?.message||'invalid key');
      }
    }catch(e){
      keyVerified=false;
      keyStatus.className='key-status key-err';
      keyStatus.textContent='✕ Could not reach imgbb — check your internet connection';
    }
    testBtn.textContent='Test';testBtn.disabled=false;
    checkReady();
  };

  zone.onclick=()=>fi.click();
  fi.onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{imageB64=ev.target.result;prev.src=imageB64;prev.style.display='block';zone.style.display='none';checkReady();};
    r.readAsDataURL(f);
  };

  ['de','dm','dh'].forEach(id=>{
    phone.querySelector('#'+id).onclick=()=>{
      diff={de:'easy',dm:'medium',dh:'hard'}[id];
      ['de','dm','dh'].forEach(x=>phone.querySelector('#'+x).classList.toggle('dsel',x===id));
    };
  });

  genBtn.onclick=async()=>{
    const key=apiKeyEl.value.trim(),name=nameEl.value.trim();
    if(!key||!name||!imageB64)return;
    genBtn.disabled=true;errEl.textContent='';
    statusEl.textContent='Resizing image…';await tick();

    let resized;
    try{resized=await resizeImage(imageB64,800);}
    catch(e){showErr('Could not process the image. Try a different file.');return;}

    statusEl.textContent='Uploading to imgbb…';await tick();

    // Use FormData — DO NOT manually set Content-Type (causes CORS preflight failure)
    const fd=new FormData();
    fd.append('key',key);
    fd.append('image',resized.split(',')[1]);

    let imgUrl;
    try{
      const res=await fetch(IMGBB,{method:'POST',body:fd});
      if(!res.ok)throw new Error('HTTP '+res.status);
      const json=await res.json();
      if(!json.success)throw new Error(json.error?.message||'Upload rejected');
      imgUrl=json.data.url;
    }catch(e){
      showErr('Upload failed: '+e.message+'. Use the Test button to check your key.');
      return;
    }

    statusEl.textContent='Building link…';await tick();

    const payload=JSON.stringify({img:imgUrl,name,msgBefore:beforeEl.value.trim(),msgAfter:afterEl.value.trim(),diff});
    const encoded=LZString.compressToEncodedURIComponent(payload);
    const url=location.href.split('#')[0]+'#play='+encoded;

    statusEl.textContent='';
    linkCard.style.display='flex';linkCard.style.flexDirection='column';
    linkUrl.textContent=url;
    genBtn.textContent='✓ Link ready!';genBtn.classList.add('green');genBtn.disabled=false;
    copyBtn.onclick=()=>copyText(url,copyBtn);
  };

  function showErr(msg){errEl.textContent=msg;statusEl.textContent='';genBtn.disabled=false;}
}

// ── INTRO ────────────────────────────────────────────────────────────────────
function showIntro(d){
  const {name,msgBefore,msgAfter,img,diff}=d;
  phone.innerHTML=`
  <div class="screen">
    <div class="sbar"><span>9:41</span><span>● ● ●</span></div>
    <div class="intro-wrap">
      <div style="margin-bottom:18px">
        <svg width="44" height="130" viewBox="0 0 44 130">
          <defs><linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#8A5E30"/><stop offset="50%" stop-color="#5C3D1E"/><stop offset="100%" stop-color="#8A5E30"/>
          </linearGradient></defs>
          <rect x="13" y="16" width="18" height="100" rx="9" fill="url(#wg)"/>
          <circle cx="22" cy="12" r="12" fill="#E0B85A"/>
          <circle cx="17" cy="7" r="4" fill="white" opacity=".45"/>
          <rect x="9" y="110" width="26" height="11" rx="5.5" fill="#E0B85A"/>
          <rect x="20" y="28" width="4" height="72" rx="2" fill="#A07EE8" opacity=".45"/>
          <circle cx="22" cy="28" r="5" fill="#3AD98A"/>
          <circle cx="22" cy="96" r="4" fill="#3AD98A" opacity=".6"/>
        </svg>
      </div>
      <div class="intro-from">A WANDCRAFT FROM</div>
      <div class="intro-name">${escHtml(name)}</div>
      <div class="intro-sent">sent you a surprise</div>
      <div class="intro-divider"></div>
      ${msgBefore?`<div class="intro-msg">"${escHtml(msgBefore)}"</div>`:'<div style="height:8px"></div>'}
      <div class="intro-btns">
        <button class="main-btn" id="startBtn">✦ &nbsp;Start the spell</button>
        <button class="main-btn purple" id="howBtn">How to play</button>
      </div>
    </div>
  </div>`;
  phone.querySelector('#startBtn').onclick=()=>showGame(diff,img,msgAfter,name);
  phone.querySelector('#howBtn').onclick=()=>showHowTo(d);
}

// ── HOW TO PLAY ───────────────────────────────────────────────────────────────
function showHowTo(d){
  phone.innerHTML=`
  <div class="screen howto-wrap">
    <div class="sbar"><span>9:41</span><span>● ● ●</span></div>
    <div style="display:flex;align-items:center;padding:6px 16px 6px;">
      <button id="backBtn" style="background:rgba(255,255,255,0.08);border:none;color:rgba(255,255,255,0.65);border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer;">← Back</button>
      <div style="flex:1;text-align:center;font-size:14px;font-weight:700;letter-spacing:1px;">HOW TO PLAY</div>
      <div style="width:60px"></div>
    </div>
    <div style="width:36px;height:2px;background:#8A67CC;border-radius:1px;margin:0 auto 10px;"></div>
    <div class="howto-body">
      ${[
        {c:'#A07EE8',n:'01',i:'👁',t:'One segment at a time',d:'Only the current piece of the groove is shown. Complete it to reveal the next.'},
        {c:'#3AD98A',n:'02',i:'☝',t:'Start on the green dot',d:'Tap the pulsing green circle to begin each segment — you must tap it to start.'},
        {c:'#A07EE8',n:'03',i:'↓',t:'Drag to the endpoint',d:'Slide your finger along the groove all the way to the green endpoint.'},
        {c:'#E85555',n:'04',i:'⚡',t:"Don't leave the path",d:'Straying off the groove breaks the spell instantly. No shortcuts!'},
        {c:'#3AD98A',n:'05',i:'✓',t:'Complete all segments',d:'Finish every segment in order and the surprise unlocks. You win!'},
      ].map(s=>`
        <div class="step-card" style="border-left:3px solid ${s.c}">
          <div style="display:flex;flex-direction:column;align-items:center;min-width:28px;gap:3px">
            <div style="font-size:9px;font-weight:700;letter-spacing:1px;color:${s.c}">${s.n}</div>
            <div style="font-size:17px">${s.i}</div>
          </div>
          <div><div class="step-title">${s.t}</div><div class="step-desc">${s.d}</div></div>
        </div>`).join('')}
      <div class="tip-card">⏱ &nbsp;You have 60 seconds — slow and steady wins the spell</div>
      <div style="height:4px"></div>
    </div>
    <div style="padding:12px 20px 20px;">
      <button class="main-btn" id="goBtn">✦ &nbsp;Start the spell</button>
    </div>
  </div>`;
  phone.querySelector('#backBtn').onclick=()=>showIntro(d);
  phone.querySelector('#goBtn').onclick=()=>showGame(d.diff,d.img,d.msgAfter,d.name);
}

// ── GAME ─────────────────────────────────────────────────────────────────────
function showGame(difficulty,imgSrc,msgAfter,senderName){
  const cfg={easy:{tol:20,endR:20,startR:20,col:C.success},medium:{tol:13,endR:14,startR:14,col:C.accent},hard:{tol:8,endR:10,startR:10,col:C.danger}}[difficulty]||{tol:13,endR:14,startR:14,col:C.accent};
  const TOTAL=60,CW=340,CH=440;
  phone.innerHTML=`
  <div class="screen">
    <div class="sbar"><span>9:41</span><span>● ● ●</span></div>
    <div class="g-hint" id="hint">Tap the green dot to begin</div>
    <div class="g-seg" id="seg" style="color:${cfg.col}">SEGMENT 1 OF ${SEGS.length}</div>
    <canvas id="cvs" width="${CW}" height="${CH}"></canvas>
    <div class="timer-wrap">
      <div class="timer-bar"><div class="timer-fill" id="tf" style="width:100%;background:${C.groove}"></div></div>
      <div class="timer-lbl" id="tl" style="color:${C.groove}">${TOTAL}s remaining</div>
    </div>
  </div>`;
  const cvs=phone.querySelector('#cvs'),ctx=cvs.getContext('2d');
  const hint=phone.querySelector('#hint'),segL=phone.querySelector('#seg');
  const tf=phone.querySelector('#tf'),tl=phone.querySelector('#tl');
  let cur=0,tracing=false,started=false,done=false,failed=false;
  let pts=[],completed=[],timeLeft=TOTAL,timerID=null,rafID=null;
  function updSeg(){segL.textContent=`SEGMENT ${cur+1} OF ${SEGS.length}`;}
  function startTimer(){
    if(timerID)return;
    timerID=setInterval(()=>{
      timeLeft--;tf.style.width=(timeLeft/TOTAL*100)+'%';
      const tc=timeLeft<=10?C.danger:timeLeft<=20?C.accent:C.groove;
      tf.style.background=tc;tl.style.color=tc;tl.textContent=timeLeft+'s remaining';
      if(timeLeft<=0){clearInterval(timerID);doFail();}
    },1000);
  }
  function doFail(){if(done||failed)return;failed=true;tracing=false;clearInterval(timerID);cancelAnimationFrame(rafID);setTimeout(()=>showFail(difficulty,imgSrc,msgAfter,senderName),650);}
  function completeSeg(){
    completed.push([...pts]);pts=[];tracing=false;
    if(cur>=SEGS.length-1){done=true;clearInterval(timerID);cancelAnimationFrame(rafID);setTimeout(()=>showReveal(imgSrc,msgAfter,senderName),800);}
    else{cur++;updSeg();hint.textContent=`Segment ${cur+1} unlocked — tap the green dot`;}
  }
  function rr(x,y,w,h,r,fill){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();ctx.fillStyle=fill;ctx.fill();}
  function sp(p,lw,color,glow){if(p.length<2)return;if(glow){ctx.save();ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.strokeStyle='rgba(160,126,232,0.18)';ctx.lineWidth=lw+12;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();ctx.restore();}ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);for(let i=1;i<p.length;i++)ctx.lineTo(p[i].x,p[i].y);ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
  function draw(){
    ctx.clearRect(0,0,CW,CH);
    const wg=ctx.createLinearGradient(156,0,184,0);wg.addColorStop(0,C.wandL);wg.addColorStop(.5,C.wand);wg.addColorStop(1,C.wandL);rr(156,36,28,380,14,wg);
    const hg=ctx.createLinearGradient(146,0,194,0);hg.addColorStop(0,'#B38010');hg.addColorStop(.5,C.accent);hg.addColorStop(1,'#B38010');rr(146,410,48,18,9,hg);
    ctx.beginPath();ctx.arc(170,32,17,0,Math.PI*2);ctx.fillStyle=done?C.success:C.accent;ctx.fill();
    ctx.beginPath();ctx.arc(163,26,5,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fill();
    completed.forEach(p=>sp(p,7,C.groove,false));
    if(!done){const s=SEGS[cur];sp([s[0],s[1]],7,C.grooveDim,false);}
    if(pts.length>1)sp(pts,7,failed?C.danger:C.groove,!failed);
    if(tracing&&pts.length>0){const lp=pts[pts.length-1];ctx.beginPath();ctx.arc(lp.x,lp.y,20,0,Math.PI*2);ctx.fillStyle=failed?'rgba(232,85,85,0.18)':'rgba(160,126,232,0.18)';ctx.fill();ctx.beginPath();ctx.arc(lp.x,lp.y,9,0,Math.PI*2);ctx.fillStyle=failed?C.danger:C.groove;ctx.fill();}
    if(!done&&!failed){
      const seg=SEGS[cur],S=seg[0],E=seg[1];
      const p1=.5+.5*Math.sin(Date.now()/350),p2=.5+.5*Math.sin(Date.now()/400+1);
      if(!tracing){ctx.beginPath();ctx.arc(S.x,S.y,18+p1*6,0,Math.PI*2);ctx.fillStyle=`rgba(58,217,138,${.07+p1*.10})`;ctx.fill();ctx.beginPath();ctx.arc(S.x,S.y,12,0,Math.PI*2);ctx.fillStyle='rgba(58,217,138,0.20)';ctx.fill();ctx.beginPath();ctx.arc(S.x,S.y,7,0,Math.PI*2);ctx.fillStyle=C.success;ctx.fill();ctx.beginPath();ctx.arc(S.x-2,S.y-2,2.5,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fill();ctx.fillStyle=C.success;ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(cur===0?'START HERE':'CONTINUE',S.x,S.y+28);}
      ctx.beginPath();ctx.arc(E.x,E.y,cfg.endR,0,Math.PI*2);ctx.strokeStyle=`rgba(58,217,138,${.30+p2*.25})`;ctx.lineWidth=2;ctx.stroke();ctx.beginPath();ctx.arc(E.x,E.y,6,0,Math.PI*2);ctx.fillStyle='rgba(58,217,138,0.75)';ctx.fill();ctx.fillStyle='rgba(58,217,138,0.85)';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText(cur===SEGS.length-1?'FINISH':'NEXT',E.x+20,E.y+4);
    }
    rafID=requestAnimationFrame(draw);
  }
  rafID=requestAnimationFrame(draw);
  function gp(e){const r=cvs.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:s.clientX-r.left,y:s.clientY-r.top};}
  function ds(p,a,b){const dx=b.x-a.x,dy=b.y-a.y;if(!dx&&!dy)return Math.hypot(p.x-a.x,p.y-a.y);const t=Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy)));return Math.hypot(p.x-(a.x+t*dx),p.y-(a.y+t*dy));}
  function onDown(e){e.preventDefault();if(done||failed||tracing)return;const p=gp(e),S=SEGS[cur][0];if(Math.hypot(p.x-S.x,p.y-S.y)>cfg.startR)return;tracing=true;if(!started){started=true;startTimer();}pts=[p];hint.textContent='Trace to the green endpoint';}
  function onMove(e){e.preventDefault();if(!tracing||done||failed)return;const p=gp(e),seg=SEGS[cur];if(ds(p,seg[0],seg[1])>cfg.tol){pts.push(p);doFail();return;}pts.push(p);if(Math.hypot(p.x-seg[1].x,p.y-seg[1].y)<=cfg.endR)completeSeg();}
  function onUp(e){e.preventDefault();tracing=false;}
  cvs.addEventListener('mousedown',onDown,{passive:false});cvs.addEventListener('mousemove',onMove,{passive:false});cvs.addEventListener('mouseup',onUp);cvs.addEventListener('mouseleave',onUp);
  cvs.addEventListener('touchstart',onDown,{passive:false});cvs.addEventListener('touchmove',onMove,{passive:false});cvs.addEventListener('touchend',onUp);
}

// ── REVEAL ───────────────────────────────────────────────────────────────────
function showReveal(imgSrc,msgAfter,senderName){
  phone.innerHTML=`
  <div class="screen">
    <div class="reveal-wrap">
      <div class="sbar" style="width:100%"><span>9:41</span><span>● ● ●</span></div>
      <div style="width:54px;height:54px;border-radius:50%;border:2px solid #3AD98A;background:rgba(58,217,138,0.12);display:flex;align-items:center;justify-content:center;font-size:24px;color:#3AD98A;">✓</div>
      <div style="font-size:20px;font-weight:700;letter-spacing:2px;">RUNE CARVED!</div>
      <img src="${escHtml(imgSrc)}" class="reveal-img" alt="Surprise" crossorigin="anonymous"/>
      ${msgAfter?`<div class="reveal-end-msg">"${escHtml(msgAfter)}"</div>`:''}
      <div class="reveal-ty">— Thank you for playing 🪄 —</div>
      <button class="dl-btn" id="dlBtn">⬇ &nbsp;Save image</button>
      <button class="ghost" onclick="showSender()">← Send your own WandCraft</button>
    </div>
  </div>`;
  phone.querySelector('#dlBtn').onclick=async()=>{
    try{const res=await fetch(imgSrc);const blob=await res.blob();const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`wandcraft-from-${senderName.replace(/\s+/g,'-')}.jpg`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);}
    catch(e){window.open(imgSrc,'_blank');}
  };
}

// ── FAIL ─────────────────────────────────────────────────────────────────────
function showFail(diff,imgSrc,msgAfter,senderName){
  phone.innerHTML=`
  <div class="screen">
    <div class="center-screen">
      <div class="sbar" style="width:100%"><span>9:41</span><span>● ● ●</span></div>
      <div style="font-size:44px;color:#E85555">✕</div>
      <div style="font-size:20px;font-weight:700">OFF THE PATH</div>
      <div style="font-size:13px;color:rgba(255,255,255,.5);line-height:1.6;max-width:260px">The spell broke — the surprise stays locked. Give it another go!</div>
      <div style="background:rgba(232,85,85,.08);border-radius:12px;padding:10px 14px;font-size:11px;color:rgba(255,255,255,.6);text-align:center;max-width:240px;line-height:1.6"><strong style="color:#E0B85A">Tip:</strong> Tap the green dot, drag slowly along the violet line to each checkpoint.</div>
      <button class="main-btn" style="max-width:210px" id="retry">Try again</button>
    </div>
  </div>`;
  phone.querySelector('#retry').onclick=()=>showGame(diff,imgSrc,msgAfter,senderName);
}

// ── ERROR ────────────────────────────────────────────────────────────────────
function showError(title,sub){
  phone.innerHTML=`
  <div class="screen">
    <div class="center-screen">
      <div style="font-size:44px">🪄</div>
      <div style="font-size:20px;font-weight:700">${title}</div>
      <div style="font-size:13px;color:rgba(255,255,255,.45);line-height:1.55;max-width:260px">${sub}</div>
      <button class="main-btn" style="max-width:210px" onclick="showSender()">Create your own</button>
    </div>
  </div>`;
}

// ── UTILS ────────────────────────────────────────────────────────────────────
const tick=()=>new Promise(r=>setTimeout(r,30));
const escHtml=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function resizeImage(dataUrl,maxDim){
  return new Promise((res,rej)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){if(w>h){h=Math.round(h*maxDim/w);w=maxDim;}else{w=Math.round(w*maxDim/h);h=maxDim;}}
      const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.80));
    };img.onerror=rej;img.src=dataUrl;
  });
}
function copyText(text,btn){
  navigator.clipboard.writeText(text).then(()=>{btn.textContent='✓  Copied!';setTimeout(()=>btn.textContent='⎘  Copy link',2200);})
  .catch(()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);btn.textContent='✓  Copied!';setTimeout(()=>btn.textContent='⎘  Copy link',2200);});
}

window.showSender=showSender;
route();
