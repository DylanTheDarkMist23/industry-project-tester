<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!--
    This meta tag makes sure the page looks correct on phones.
    Without it, mobile browsers would zoom out and show a tiny desktop version.
    user-scalable=no prevents pinch-zoom, keeping the game feeling native.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

  <title>WandCarve</title>

  <!--
    External CSS file — all the visual styling lives in style.css.
    Keeping CSS separate makes it much easier to change how things look
    without accidentally breaking any of the game logic.
  -->
  <link rel="stylesheet" href="style.css" />

  <!--
    LZ-String is a free, open-source compression library.
    We use it to squash the JSON payload (image URL + messages + difficulty)
    into a compact string that fits neatly inside a URL.
    Loaded from jsDelivr CDN so the user does not need to install anything.
    Source: https://github.com/pieroxy/lz-string
  -->
  <script src="https://cdn.jsdelivr.net/npm/lz-string@1.5.0/libs/lz-string.min.js"></script>
</head>

<body>

  <!--
    The outer #app div centres everything on the page.
    The inner #phone div acts as our "phone frame" — the game always
    renders inside this fixed-width container so it looks like a mobile app
    even when opened on a big desktop screen.
  -->
  <div id="app">
    <div class="phone" id="phone">
      <!-- All screens are injected here dynamically by app.js -->
    </div>
  </div>

  <!--
    The game logic is split across three JS files, loaded in order:
      1. config.js  — shared constants (colours, groove coordinates, API URL)
      2. utils.js   — small helper functions used everywhere
      3. app.js     — the main application: routing, all screens, game loop
    They must be loaded in this order because app.js depends on config.js and utils.js.
  -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>

</body>

</html>
